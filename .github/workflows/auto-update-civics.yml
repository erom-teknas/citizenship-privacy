name: 🍁 Live Auto-Sync Canadian Premiers & Viceroys

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC (5:00 AM EDT)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  auto-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🇨🇦 Run Civics Sync Engine
        run: |
          python3 update_civics.py

      - name: 🔍 Check for Differences
        id: git_diff
        run: |
          if [ -n "$(git status --porcelain provinces_data.json)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "🔄 Leadership change detected! Pushing update..."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ All leaders are 100% current."
          fi

      - name: 🚀 Push Directly to Main (Instant Live Update)
        if: steps.git_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add provinces_data.json CIVICS_CHANGELOG.md
          git commit -m "chore(civics): automated leadership update [skip ci]"
          git push origin main
